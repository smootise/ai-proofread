<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Proofreader{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="/ui">Proofreader</a>
      <ul class="nav-links">
        <li><a href="/ui">Dashboard</a></li>
        <li><a href="/ui/history">History</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Local-first — corrections stay on your machine.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
